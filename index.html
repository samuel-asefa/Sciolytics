    <!-- Apply saved theme before first paint (prevents a light/dark flash) -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('theme');
          var b = localStorage.getItem('brightness');
          var s = localStorage.getItem('bgStyle');
          if (!b) b = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default';
          if (t) d.setAttribute('data-theme', t);
          d.setAttribute('data-brightness', b);
          if (s) d.setAttribute('data-bg-style', s);
        } catch (e) {}
      })();
    </script>
